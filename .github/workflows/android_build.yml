name: Build Messenger APK

on:
  push:
    branches: [main, master, 'chatgpt/trivo-security-compat-20261031']
  workflow_dispatch:

permissions:
  contents: write

# Do not bootstrap two different signing keys from concurrent runs.
concurrency:
  group: trivo-debug-apk-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRIVO_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: gradle

      # Test-only key. Never commit a signing private key to this public repo.
      - name: Restore persistent emulator debug signing key
        id: trivo-signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: trivo-emulator-debug-signing-v1

      - name: Refuse incompatible signing-key rotation
        env:
          CACHE_HIT: ${{ steps.trivo-signing-cache.outputs.cache-hit }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ "$CACHE_HIT" != "true" ]; then
            # First established signer: build-338 only.
            # Missing cache on later runs is an error, NEVER regenerate it.
            if [ "$BUILD_NUMBER" != "338" ]; then
              echo "::error::Stable Trivo debug signing key is missing. Refusing to release an incompatible APK."
              exit 1
            fi
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 3072 -validity 12000 \
              -dname "CN=Trivo Emulator QA Debug,O=Trivo,C=KZ"
          fi
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android >/dev/null

      # A failing test must not cause the next build to rotate the signing key.
      - name: Save consistent emulator debug signer immediately
        if: steps.trivo-signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: trivo-emulator-debug-signing-v1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.3-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.3-

      - name: Install Dependencies (frozen bun.lock)
        run: bun install --frozen-lockfile

      - name: Audit every tracked repository file and text line
        run: node scripts/audit-repository.mjs

      # Supplement the raw line scan with actual TypeScript/React ESLint.
      # This is report-only for the EXISTING lint baseline, not a false claim
      # that all findings are fixed; compiler/tests/build continue independently.
      - name: Collect full ESLint audit for all project sources
        run: |
          set +e
          bunx eslint . --format json > "$RUNNER_TEMP/trivo-repo-audit/eslint.json"
          RESULT=$?
          set -e
          echo "ESLint exit status: $RESULT"
          node scripts/summarize-eslint-audit.mjs "$RUNNER_TEMP/trivo-repo-audit/eslint.json"

      - name: Upload full repository audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivo-repository-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/trivo-repo-audit/
          retention-days: 30
          if-no-files-found: error

      - name: Run unit tests
        run: bunx vitest run

      # CI confirmed the TypeScript baseline passes: block new type errors.
      - name: TypeScript strict check
        run: bunx tsc --noEmit --pretty false

      - name: Build Web Assets
        run: |
          CAP_BUILD=1 bun run build
          node scripts/stage-web.mjs
          node scripts/fix-relative-assets.mjs
          node scripts/verify-web-dir.mjs

      - name: Validate Web Directory Before Sync
        run: |
          test -f www/index.html || { echo "www/index.html missing"; exit 1; }
          ls -la www

      - name: Bootstrap Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSLo android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f android/gradlew ]; then
            curl -sSLo android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew
          fi
          chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Run Android JVM tests and build APK (debug)
        working-directory: android
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Select Universal APK
        id: apk
        run: |
          DIR=android/app/build/outputs/apk/debug
          ls -la "$DIR"
          APK=$(ls "$DIR"/*universal*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Universal APK not found in $DIR"; exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Universal APK: $APK"

      - name: Audit built APK Android SDK compatibility
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT" || { echo "Android 36 build-tools aapt missing"; exit 1; }
          "$AAPT" dump badging "$APK_PATH" > /tmp/trivo-apk-badging.txt
          grep -F "package: name='com.baurp.trivochat'" /tmp/trivo-apk-badging.txt
          grep -F "sdkVersion:'24'" /tmp/trivo-apk-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/trivo-apk-badging.txt
          grep -F "versionCode='${TRIVO_VERSION_CODE}'" /tmp/trivo-apk-badging.txt
          echo "Verified packaged SDK bounds and increasing versionCode."

      - name: Verify APK integrity and Android signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          unzip -tqq "$APK_PATH"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" \
            | tee /tmp/trivo-apk-signature.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" \
            /tmp/trivo-apk-signature.txt
          grep -F "Signer #1 certificate SHA-256 digest:" /tmp/trivo-apk-signature.txt
          sha256sum "$APK_PATH"

      - name: Audit libtor.so per ABI
        run: |
          APK="${{ steps.apk.outputs.path }}"
          FAIL=0
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libtor.so"; then
              echo "OK   lib/$ABI/libtor.so"
            else
              echo "MISS lib/$ABI/libtor.so"; FAIL=1
            fi
          done
          unzip -l "$APK" | grep "\.so$" || true
          exit $FAIL

      # Verify a real Android PackageManager accepts the complete APK.
      - name: Enable Android emulator KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::KVM unavailable on GitHub runner"
            exit 1
          fi

      - name: Smoke-test APK installation on Android 15 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TRIVO_APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          # Runner executes each script line in its own shell. ONE command only.
          script: bash .github/scripts/verify-apk-install.sh

      - name: Create Release & Upload Universal APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import json
          from pathlib import Path

          github_token = os.environ.get("GITHUB_TOKEN")
          repository = os.environ.get("GITHUB_REPOSITORY")
          run_number = os.environ.get("GITHUB_RUN_NUMBER")
          ref_name = os.environ.get("GITHUB_REF_NAME", "main")
          apk_path_str = os.environ.get("APK_PATH")

          if not apk_path_str or not Path(apk_path_str).exists():
              raise SystemExit(f"КРИТИЧЕСКАЯ ОШИБКА: Универсальный APK не найден по пути {apk_path_str}!")
          apk_path = Path(apk_path_str)

          headers = {
              "Authorization": f"Bearer {github_token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          tag_name = f"build-{run_number}"
          release_data = json.dumps({
              "tag_name": tag_name,
              "target_commitish": ref_name,
              "name": f"Trivo Chat APK Build #{run_number}",
              "body": "Автоматическая сборка универсального APK для приложения Trivo Chat.",
              "draft": False,
              "prerelease": True
          }).encode("utf-8")

          print("Создание релиза на GitHub...")
          req = urllib.request.Request(f"https://api.github.com/repos/{repository}/releases", data=release_data, headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req) as resp:
                  release_json = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"Ошибка API GitHub: {e.code} - {e.read().decode('utf-8')}")
              raise

          upload_url_template = release_json["upload_url"]
          upload_url = upload_url_template.split("{")[0] + f"?name={apk_path.name}"

          print("Загрузка универсального APK файла в релиз...")
          file_data = apk_path.read_bytes()
          upload_headers = {
              "Authorization": f"Bearer {github_token}",
              "Content-Type": "application/vnd.android.package-archive",
              "Content-Length": str(len(file_data))
          }

          req_upload = urllib.request.Request(upload_url, data=file_data, headers=upload_headers, method="POST")
          with urllib.request.urlopen(req_upload) as resp_upload:
              asset_json = json.loads(resp_upload.read().decode("utf-8"))

          download_url = asset_json["browser_download_url"]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("## 📱 Готовый файл APK:\n\n")
                  f.write(f"[🚀 НАЖМИ СЮДА, ЧТОБЫ СКАЧАТЬ APK]({download_url})\n")
          print(f"Ссылка успешно создана: {download_url}")
          PY
