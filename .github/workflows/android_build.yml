name: Build Messenger APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install Dependencies (frozen bun.lock)
        run: bun install --frozen-lockfile

      - name: Build Web Assets
        run: |
          CAP_BUILD=1 bun run build
          node scripts/stage-web.mjs
          node scripts/fix-relative-assets.mjs
          node scripts/verify-web-dir.mjs

      - name: Validate Web Directory Before Sync
        run: |
          test -f www/index.html || { echo "www/index.html missing"; exit 1; }
          ls -la www

      - name: Bootstrap Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSLo android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f android/gradlew ]; then
            curl -sSLo android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew
          fi
          chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (debug)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Select Universal APK
        id: apk
        run: |
          DIR=android/app/build/outputs/apk/debug
          ls -la "$DIR"
          APK=$(ls "$DIR"/*universal*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Universal APK not found in $DIR"; exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Universal APK: $APK"

      - name: Audit libtor.so per ABI
        run: |
          APK="${{ steps.apk.outputs.path }}"
          FAIL=0
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libtor.so"; then
              echo "OK   lib/$ABI/libtor.so"
            else
              echo "MISS lib/$ABI/libtor.so"; FAIL=1
            fi
          done
          unzip -l "$APK" | grep "\.so$" || true
          exit $FAIL

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: trivo-chat-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Trivo Chat APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Universal APK: \`$(basename "${{ steps.apk.outputs.path }}")\` — download from the **Artifacts** section of this run." >> "$GITHUB_STEP_SUMMARY"
