// Trivo Chat Elite — Synchronized version controller
// All Android module versions live here for single-source-of-truth.
ext {
    // SDK / Tooling
    // Capacitor 8 supports Android 7 (API 24) onward. Compile against
    // Android 16 (API 36), while keeping Capacitor 8's supported target API 36.
    // Android 17 (API 37) is included as a runtime compatibility test target.
    // Upgrading compile/target SDK requires a separate dependency validation.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    buildToolsVersion = '36.0.0'
    ndkVersion = '26.1.10909125'

    // Kotlin / AGP
    kotlin_version = '2.1.0'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    androidxBrowserVersion = '1.8.0'
    androidxMaterialVersion = '1.13.0'
    androidxWebkitVersion = '1.14.0'

    // Test
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'

    // Cordova compatibility
    cordovaAndroidVersion = '14.0.1'

}
